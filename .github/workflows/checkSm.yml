name: Check sm.txt

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

jobs:
  check-sm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Simulate slow CI
        run: |
          echo "Event: ${{ github.event_name }}, ref: ${{ github.ref }}"
          echo "Sleeping 2 minutes to simulate a slow required check..."
          sleep 120

      - name: Check sm.txt is at most 10 lines
        run: |
          max=10
          lines=$(wc -l < sm.txt | tr -d ' ')
          echo "sm.txt has ${lines} lines (max allowed: ${max})"
          if [ "${lines}" -gt "${max}" ]; then
            echo "sm.txt exceeds ${max} lines — failing this check."
            exit 1
          fi
          echo "looks good"

  freshness:
    name: freshness
    needs: check-sm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Pass outside the merge queue
        if: github.event_name != 'merge_group'
        run: echo "Only meaningful in the merge queue"

      - name: Compare the queued head with the pull request's current head
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          GROUP_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          PR=$(echo "$HEAD_REF" | sed -E 's|.*/pr-([0-9]+)-[0-9a-f]+$|\1|')
          PARENTS=$(gh api "repos/${{ github.repository }}/commits/$GROUP_SHA" --jq '[.parents[].sha] | join(" ")')
          QUEUED=$(gh api "repos/${{ github.repository }}/commits/$GROUP_SHA" --jq '.parents[1].sha')
          CURRENT=$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq '.head.sha')
          echo "group $GROUP_SHA parents: $PARENTS"
          echo "PR #$PR queued head $QUEUED, current head $CURRENT"
          if [ "$QUEUED" != "$CURRENT" ]; then
            echo "::error::Pull request #$PR changed after it was queued ($QUEUED to $CURRENT). Re-review and re-queue it."
            exit 1
          fi
